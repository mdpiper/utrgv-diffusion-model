[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "utrgv-diffusion-model"
version = "0.1.0"
dependencies = [
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
testing = [
  "pytest",
]

[tool.setuptools]
py-modules = ["diffusion_model"]
